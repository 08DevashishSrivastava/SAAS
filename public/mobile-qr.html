<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Open Caption AI on Your Phone</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2.5rem; border-radius: 1rem; border: 1px solid #334155; text-align: center; max-width: 420px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
    h1 { margin-top: 0; color: #38bdf8; font-size: 1.5rem; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .url { font-family: monospace; font-size: 1.1rem; background: #090d16; color: #38bdf8; padding: 0.6rem 1rem; border-radius: 0.5rem; border: 1px solid #0284c7; display: inline-block; margin: 1rem 0; word-break: break-all; }
    img { border-radius: 0.75rem; background: #ffffff; padding: 12px; margin-top: 1rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
    .tip { font-size: 0.85rem; color: #64748b; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📱 Open Caption AI on Your Phone</h1>
    <p>Scan this QR code with your phone camera:</p>
    <div>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=http://192.168.29.28:3000" width="220" height="220" alt="QR Code" />
    </div>
    <div class="url">http://192.168.29.28:3000</div>
    <p class="tip">Make sure your phone is connected to the same Wi-Fi network.</p>
  </div>
</body>
</html>
